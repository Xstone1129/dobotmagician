# Full Dobot Magician + suction cup learning configuration.
data:
  demos_dir: data/demos_suction_turn
  time_column: t
  coordinate_columns: [x, y, z]
  gripper_column: gripper

model:
  algorithm: compare
  active_algorithm: gmm_gmr_dmp

plot:
  output_path: models/suction_arm/learned_trajectory.png
  comparison_output_path: models/suction_arm/trajectory_comparison.png
  intermediate_output_dir: models/suction_arm/intermediate

gmm_gmr_dmp:
  output_path: models/suction_arm/gmm_gmr_dmp.joblib
  plot_output_path: models/suction_arm/learned_trajectory_gmm_gmr_dmp.png
  params: {n_time_steps: 180, n_components: 8, covariance_type: full, reg_covar: 0.000001, random_state: 7, dmp_basis: 18, dmp_alpha_z: 25.0, dmp_beta_z: 6.25, dmp_alpha_s: 1.0, ridge_lambda: 0.000001}
inc_gmm_gmr_dmp:
  output_path: models/suction_arm/inc_gmm_gmr_dmp.joblib
  plot_output_path: models/suction_arm/learned_trajectory_inc_gmm_gmr_dmp.png
  params: {n_time_steps: 180, inc_lam: 0.25, dmp_basis: 50, dmp_alpha_z: 25.0, dmp_beta_z: 6.25, dmp_alpha_s: 1.0, ridge_lambda: 0.000001}
gmm_gmr_segmented_dmp:
  output_path: models/suction_arm/gmm_gmr_segmented_dmp.joblib
  plot_output_path: models/suction_arm/learned_trajectory_gmm_gmr_segmented_dmp.png
  params: {n_time_steps: 180, n_components: 8, covariance_type: full, reg_covar: 0.000001, random_state: 7, dmp_basis: 35, dmp_alpha_z: 25.0, dmp_beta_z: 6.25, dmp_alpha_s: 4.0, ridge_lambda: 0.000001, n_segments: 4}
bgmm_gmr_promp:
  output_path: models/suction_arm/bgmm_gmr_promp.joblib
  plot_output_path: models/suction_arm/learned_trajectory_bgmm_gmr_promp.png
  params: {n_time_steps: 180, n_components: 8, covariance_type: full, reg_covar: 0.000001, random_state: 7, promp_basis: 25, promp_basis_width: 0.08, ridge_lambda: 0.000001}
