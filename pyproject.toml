[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot-magician-bgmm-promp"
version = "0.1.0"
description = "BGMM-ProMP trajectory learning and CoppeliaSim playback for Dobot Magician."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "coppeliasim-zmqremoteapi-client>=2.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
dobot-learn = "dobot_bgmm_promp.scripts.learn:main"
dobot-play = "dobot_bgmm_promp.scripts.play_coppeliasim:main"
dobot-record = "dobot_bgmm_promp.scripts.record_coppeliasim:main"
dobot-debug-follow = "dobot_bgmm_promp.scripts.debug_coppeliasim_follow:main"
dobot-create-gripper-scene = "dobot_bgmm_promp.scripts.create_gripper_palletizing_scene:main"
dobot-create-suction-arm-scene = "dobot_bgmm_promp.scripts.create_suction_arm_scene:main"
dobot-generate-suction-demos = "dobot_bgmm_promp.scripts.generate_suction_turn_demos:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
